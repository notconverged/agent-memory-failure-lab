[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-failure-lab"
version = "0.1.0"
description = "A local-first Coding Agent Memory core and evaluation lab."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent-memory = "agent_memory.cli:main"
agent-memory-mcp = "agent_memory.mcp_server:main"
agent-memory-codex-hook = "agent_memory.codex_hook:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
